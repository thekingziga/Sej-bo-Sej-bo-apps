name: build

# Why this exists: Flutter builds Windows for the host architecture only - there
# is no --target-platform flag for Windows. Parallels on Apple Silicon can only
# run ARM64 guests, so the Mac can produce a windows-arm64 binary and nothing
# else. Practically every Windows PC is x64, so the build people will actually
# download has to come from an x64 machine. GitHub's windows-latest runner is
# x64 and free for public repositories.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  windows-x64:
    runs-on: windows-latest # x64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v

      - run: flutter pub get

      # The widget tests pump every screen at 360x640 and fail on any overflow,
      # so they are worth running before shipping a binary.
      - run: flutter test

      - run: flutter build windows --release

      - name: Confirm architecture
        shell: pwsh
        run: |
          $exe = 'build\windows\x64\runner\Release\sejbosejbo.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          # Read the PE machine field: 0x8664 = x64, 0xAA64 = ARM64.
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $fs.Position = $br.ReadInt32() + 4
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          $name = switch ($machine) { 0x8664 {'x64'} 0xAA64 {'ARM64'} default {"0x{0:X}" -f $machine} }
          Write-Host "PE machine: $name"
          if ($machine -ne 0x8664) { throw "expected x64, got $name" }

      - uses: actions/upload-artifact@v4
        with:
          name: sejbosejbo-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned: this produces a debug-keystore-signed APK, fine for sideloading
      # and testing but NOT for Play. Store uploads need a real upload key wired
      # into android/key.properties via repository secrets.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sejbosejbo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
