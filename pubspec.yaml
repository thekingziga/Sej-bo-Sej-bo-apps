name: sejbosejbo
description: "Sejbosejbo - certify the world's dumbest moments."
publish_to: 'none'
# versionName tracks the website + Docker image (thekingziga/sejbosejbo) so a
# screenshot of the app and a look at the site refer to the same release.
# The +N build number is independent and must only ever increase - Play
# permanently burns each versionCode, so it does NOT reset when the semver
# part changes.
version: 1.13.0+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  # Apple / Google in-app purchases. There is no web or Windows implementation,
  # so every call site is guarded by DonationGateway.supportsStoreBilling.
  in_app_purchase: ^3.2.0
  pasteboard: ^0.5.0
  share_plus: ^13.3.0
  app_links: ^7.2.1
  http_parser: ^4.1.2
  image_cropper: ^12.2.1
  package_info_plus: ^10.2.1
  in_app_update: ^5.0.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_platform_interface: ^1.4.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/ComicNeue-Regular.ttf
          weight: 400
        - asset: assets/fonts/ComicNeue-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/ComicNeue-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/img/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
